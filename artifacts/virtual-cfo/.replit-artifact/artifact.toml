kind = "web"
previewPath = "/"
title = "Virtual CFO"
version = "1.0.0"
id = "artifacts/virtual-cfo"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19234

[services.development]
run = "pnpm --filter @workspace/virtual-cfo run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/virtual-cfo", "run", "build" ]
run = ["pnpm", "--filter", "@workspace/virtual-cfo", "run", "serve"]

[services.env]
PORT = "19234"
BASE_PATH = "/"
